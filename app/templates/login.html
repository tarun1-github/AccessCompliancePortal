<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Access Compliance Portal - Login</title>
<style>
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#eef4ff,#f8fbff,#eefbf4);min-height:100vh;display:flex;align-items:center;justify-content:center;color:#1f2937}
.card{width:390px;background:#fff;padding:34px;border-radius:20px;box-shadow:0 15px 45px #0f172a20}
h1{margin:0 0 8px;color:#1d4ed8;font-size:25px}
.sub{color:#64748b;margin-bottom:28px}
label{display:block;font-weight:700;margin:14px 0 7px}
input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #cbd5e1;border-radius:10px;font-size:15px}
button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:800;font-size:15px;cursor:pointer}
.error{background:#fee2e2;color:#991b1b;padding:11px;border-radius:9px;margin-bottom:15px}
.note{font-size:12px;color:#64748b;margin-top:18px;line-height:1.5}
</style>
</head>
<body>
<div class="card">
<h1>CMS BOA EV Access Compliance Portal</h1>
<div class="sub">Engineer / Supervisor Login</div>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post" action="/login">
<label for="username">Username</label>
<input id="username" name="username" autocomplete="username" placeholder="Enter your alias" required>
<label for="password">Password</label>
<input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
<button type="submit">Login</button>
</form>
<div class="note">Username is your assigned engineer alias. This portal uses local authentication and does not use AD.</div>
</div>
</body>
</html>
