<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<title>
    Reset Password - Access Compliance Portal
</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #0f172a,
            #1e3a8a
        );

    display: flex;

    align-items: center;

    justify-content: center;
}

.container {

    width: 100%;

    max-width: 450px;

    padding: 20px;
}

.card {

    background: white;

    border-radius: 16px;

    padding: 35px;

    box-shadow:
        0 20px 50px
        rgba(0,0,0,.25);
}

.logo {

    width: 65px;

    height: 65px;

    margin: auto;

    border-radius: 50%;

    background: #059669;

    color: white;

    display: flex;

    align-items: center;

    justify-content: center;

    font-weight: 800;

    font-size: 25px;
}

h1 {

    text-align: center;

    font-size: 23px;

    margin: 18px 0 8px;
}

.subtitle {

    text-align: center;

    color: #64748b;

    font-size: 14px;

    margin-bottom: 25px;
}

.user {

    background: #f1f5f9;

    padding: 11px;

    border-radius: 8px;

    margin-bottom: 20px;

    text-align: center;

    font-size: 14px;
}

label {

    display: block;

    font-weight: 700;

    margin-bottom: 7px;
}

input {

    width: 100%;

    padding: 12px;

    border:
        1px solid #cbd5e1;

    border-radius: 8px;

    margin-bottom: 18px;

    font-size: 15px;
}

button {

    width: 100%;

    padding: 13px;

    border: 0;

    border-radius: 8px;

    background: #059669;

    color: white;

    font-size: 15px;

    font-weight: 800;

    cursor: pointer;
}

button:hover {

    background: #047857;
}

.error {

    background: #fee2e2;

    border:
        1px solid #fecaca;

    color: #991b1b;

    padding: 12px;

    border-radius: 8px;

    margin-bottom: 18px;

    font-size: 14px;
}

.hint {

    color: #64748b;

    font-size: 12px;

    margin-top: -10px;

    margin-bottom: 18px;
}

</style>

</head>


<body>

<div class="container">

<div class="card">


<div class="logo">
    AC
</div>


<h1>
    Set New Password
</h1>


<div class="subtitle">
    Access Compliance Portal
</div>


{% if error %}

<div class="error">
    {{ error }}
</div>

{% endif %}


{% if engineer %}

<div class="user">

    Resetting password for

    <strong>
        {{ engineer.name }}
    </strong>

    <br>

    <span>
        {{ engineer.alias }}
    </span>

</div>


<form
    method="post"
    action="/reset-password"
>


<input
    type="hidden"
    name="token"
    value="{{ token }}"
>


<label for="new_password">
    New Password
</label>

<input
    type="password"
    id="new_password"
    name="new_password"
    minlength="8"
    autocomplete="new-password"
    placeholder="Enter new password"
    required
>


<div class="hint">
    Password must be at least 8 characters.
</div>


<label for="confirm_password">
    Confirm Password
</label>

<input
    type="password"
    id="confirm_password"
    name="confirm_password"
    minlength="8"
    autocomplete="new-password"
    placeholder="Confirm new password"
    required
>


<button type="submit">
    Set New Password
</button>


</form>

{% endif %}


</div>

</div>

</body>

</html>
