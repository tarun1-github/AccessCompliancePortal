<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Change Password
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            background: #f3f4f6;

            display: flex;

            align-items: center;

            justify-content: center;
        }

        .card {
            width: 100%;

            max-width: 450px;

            background: white;

            padding: 35px;

            border-radius: 14px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.12);
        }

        h1 {
            margin-top: 0;

            text-align: center;

            color: #111827;
        }

        .user {
            text-align: center;

            color: #6b7280;

            margin-bottom: 25px;
        }

        label {
            display: block;

            font-weight: 600;

            margin-bottom: 7px;

            color: #374151;
        }

        input {
            width: 100%;

            padding: 12px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            margin-bottom: 18px;

            font-size: 15px;
        }

        input:focus {
            outline: none;

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.12);
        }

        button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            background: #fee2e2;

            color: #b91c1c;

            border: 1px solid #fecaca;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 18px;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 18px;

            text-decoration: none;

            color: #2563eb;
        }

    </style>

</head>


<body>

<div class="card">

    <h1>
        Change Password
    </h1>


    {% if engineer %}

    <div class="user">

        Logged in as:

        <strong>
            {{ engineer.alias }}
        </strong>

    </div>

    {% endif %}


    {% if error %}

    <div class="error">

        {{ error }}

    </div>

    {% endif %}


    <form
        method="post"
        action="/change-password"
    >

        <label>
            Current Password
        </label>

        <input
            type="password"
            name="current_password"
            autocomplete="current-password"
            required
        >


        <label>
            New Password
        </label>

        <input
            type="password"
            name="new_password"
            minlength="8"
            autocomplete="new-password"
            required
        >


        <label>
            Confirm New Password
        </label>

        <input
            type="password"
            name="confirm_password"
            minlength="8"
            autocomplete="new-password"
            required
        >


        <button type="submit">

            Change Password

        </button>

    </form>


    <a
        href="/"
        class="back"
    >
        Back to Portal
    </a>

</div>

</body>

</html>
