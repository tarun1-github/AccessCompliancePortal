<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Change Password</title>
<style>
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f1f5f9;min-height:100vh;display:flex;align-items:center;justify-content:center}.card{width:420px;background:#fff;padding:32px;border-radius:18px;box-shadow:0 12px 35px #0002}h1{color:#1d4ed8}label{display:block;font-weight:700;margin:14px 0 7px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd5e1;border-radius:9px}button{width:100%;margin-top:20px;padding:12px;background:#2563eb;color:#fff;border:0;border-radius:9px;font-weight:800}.error{color:#991b1b;background:#fee2e2;padding:10px;border-radius:8px}
</style>
</head>
<body>
<div class="card">
<h1>Change Password</h1>
<p>Logged in as <strong>{{ engineer.alias }}</strong></p>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post" action="/change-password">
<label>Current password</label>
<input name="current_password" type="password" autocomplete="current-password" required>
<label>New password</label>
<input name="new_password" type="password" minlength="8" autocomplete="new-password" required>
<label>Confirm new password</label>
<input name="confirm_password" type="password" minlength="8" autocomplete="new-password" required>
<button type="submit">Change Password</button>
</form>
</div>
</body>
</html>
